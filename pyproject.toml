[build-system]
requires = [
    "setuptools>=61.0",
    "pip>=22.3"
]
build-backend = "setuptools.build_meta"

[project]
name = "twitterdownloader"
version = "0.1.3"
description = "Download posts from X, talk with Grok"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
"aiohttp",
"tqdm",
"aiohttp_socks",
]
[tool.setuptools.package-data]
twitterdownloader = ["*.js"]

[project.scripts]
twitterdownloader = "twitterdownloader.twitterdownloader:main"
grok = "twitterdownloader.grok:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["twitterdownloader*"]